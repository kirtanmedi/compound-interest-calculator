AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Compound interest calculator: private S3 bucket served through CloudFront
  (Origin Access Control). Static site, so there is no compute to pay for.

Parameters:
  DomainName:
    Type: String
    Default: ''
    Description: Optional custom domain (e.g. calc.example.com). Leave blank to use the CloudFront URL.
  CertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate ARN for DomainName. Must be issued in us-east-1. Required when DomainName is set.
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:acm:us-east-1:\d{12}:certificate/.+$'
    ConstraintDescription: must be an ACM certificate ARN in us-east-1 (CloudFront requirement)

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, '']]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      cfn-lint:
        config:
          # CertificateArn may be '' by default; it's only referenced when HasDomain is true.
          ignore_checks: [W1030]
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName}'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        # Cheapest edge tier: North America, Europe and Israel.
        PriceClass: PriceClass_100
        Aliases: !If [HasDomain, [!Ref DomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed "CachingOptimized": honors the Cache-Control headers set at upload and
          # ignores query strings, so every shared scenario link hits the same cached page.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Managed "SecurityHeadersPolicy": HSTS, X-Content-Type-Options, X-Frame-Options, etc.
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        # S3 with OAC answers 403 for missing keys; serve the app instead of an XML error.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 60

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  SiteUrl:
    Value: !If
      - HasDomain
      - !Sub 'https://${DomainName}'
      - !Sub 'https://${Distribution.DomainName}'
  CloudFrontDomain:
    Description: Point your DNS (CNAME / Route 53 alias) here when using a custom domain.
    Value: !GetAtt Distribution.DomainName
